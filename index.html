<!DOCTYPE html>
<html lang="fr">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="assets/css/style.css">
<title>Sylvain Bohrer</title>
</head>
<body>

<main class="stage">

  <article class="card" aria-label="Carte de visite">
    <div class="card-haut">

      <!-- Contenu principal : -->
      <section class="contenu-principal">
        <div class="etiquette">01 — Photographie</div>
        <h1 class="displaynone-max-smartwatch">Capturer l'<span class="focus-mot">instant</span>, tel qu'il est.</h1>
        <p>
          Photographe passionné, je saisie en priorité les moments d'émotions spontanées de vos enfants, de votre famille et amis lors de votre mariage.
        </p>
      </section>

      <!-- Contenu vertical : -->
      <aside class="box-vignette displaynone-max-smartwatch">
          <img src="assets/images/p1.svg" alt="Portrait enfant" class="visuel-image displaynone-max-smartwatch">
          <img src="assets/images/p2.svg" alt="Portrait enfant" class="visuel-image displaynone-max-mini-mobile displaynone-max-smartwatch">
          <img src="assets/images/p3.svg" alt="Portrait enfant" class="visuel-image displaynone-max-mini-mobile displaynone-max-smartwatch">
      </aside>

    </div>

    <!-- footer -->
    <footer class="box-footer">
        <img src="assets/images/logo.svg"
            alt="logo de Sylvain Bohrer"
            title="logo de Sylvain Bohrer"
            class="footer-logo">
        <span class="footer-texte">Sylvain Bohrer</span>
    </footer>

  </article>

</main>

</body>
</html>
