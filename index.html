<!DOCTYPE html>
<html lang="fr">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
<title>Sylvain Bohrer</title>
</head>
<body>

<main class="stage">

  <article class="card" aria-label="Carte de visite">

    <!-- Rangée du haut : 3/4 de la hauteur de la card -->
    <div class="card-haut">

      <!-- Contenu principal : 3/4 de la largeur -->
      <section class="contenu-principal">
        <div class="etiquette">01 — Photographie</div>
        <h1>Capturer l'<span class="focus-mot">instant</span>, tel qu'il est.</h1>
        <p>
          Photographe passionné, je saisie en priorité les moments d'émotions spontanées de vos enfants, de votre famille et amis lors de votre mariage.
        </p>
      </section>

      <!-- Contenu vertical : 1/4 de la largeur -->
      <aside class="contenu-vertical">
        <figure class="visuel">
          <img src="assets/images/p1.svg" alt="Portrait enfant" class="visuel-image">
          <!-- <figcaption class="visuel-legende">Portrait</figcaption> -->
        </figure>

        <figure class="visuel">
          <img src="assets/images/p2.svg" alt="Portrait enfant" class="visuel-image">
          <!-- <figcaption class="visuel-legende">Portrait</figcaption> -->
        </figure>

        <figure class="visuel">
          <img src="assets/images/p3.svg" alt="Portrait enfant" class="visuel-image">
          <!-- <figcaption class="visuel-legende">Portrait</figcaption> -->
        </figure>
      </aside>

    </div>

    <!-- Rangée du bas : 1/4 de la hauteur, toute la largeur -->
    <footer class="card-bas">
      <div class="card-bas-gauche">
        <img src="assets/images/logo.svg"
            alt="logo"
            class="card-bas-logo">
        <img src="assets/images/Sylvain_Bohrer.svg"
            alt="company name / watermark"
            class="card-bas-nom">
      </div>

      <div class="card-bas-droite">
        <!-- <span>a3e7d6@gmail.com</span>
        <span>France</span> -->
      </div>
    </footer>

  </article>

</main>

</body>
</html>
